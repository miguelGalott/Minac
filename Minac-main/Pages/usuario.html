
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Minac</title>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Alike&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/cores.css">
    <link rel="stylesheet" href="../Css/geral.css">
    <link rel="stylesheet" href="../Css/paginas.css">
</head>
<body>

    <header class="topo-config">
        <!-- IMAGEM: seta/gato de voltar. Volta para a home -->
        <a href="../index.html" class="voltar-config"><img src="../imagens/voltarMinac.png" alt="Voltar para o início"></a>
        <!-- IMAGEM: gato dormindo com o texto "Configurações" -->
        <h1><img class="logo-config" src="../imagens/configuracoesMinac.png" alt="Configurações"></h1>
    </header>

    <main class="config">

        <nav class="abas" aria-label="Seções de configurações">
            <input type="radio" name="aba" id="abaTema" class="aba-radio sr-only">
            <label for="abaTema">Tema</label>
            <input type="radio" name="aba" id="abaAcessibilidade" class="aba-radio sr-only" checked>
            <label for="abaAcessibilidade">Acessibilidade</label>
            <input type="radio" name="aba" id="abaUsuario" class="aba-radio sr-only">
            <label for="abaUsuario">Usuário</label>
            <input type="radio" name="aba" id="abaHistorico" class="aba-radio sr-only">
            <label for="abaHistorico">Histórico</label>
        </nav>

        <div class="painel-config">

            <section class="painel" id="painelTema">
                <label class="opcao"><input type="radio" name="tema" value="claro" checked>
                    <span><strong>Tema claro</strong><small>Fundo creme, o visual padrão da Minac.</small></span></label>
                <label class="opcao"><input type="radio" name="tema" value="escuro">
                    <span><strong>Tema escuro</strong><small>Fundo escuro, mais confortável à noite.</small></span></label>
                <label class="opcao"><input type="radio" name="tema" value="auto">
                    <span><strong>Seguir o aparelho</strong><small>Troca sozinho conforme o horário do seu dispositivo.</small></span></label>
            </section>

            <section class="painel" id="painelAcessibilidade">
                <label class="opcao"><input type="checkbox" name="acess" value="fonte" checked>
                    <span><strong>Aumentar o tamanho do texto</strong><small>Letras maiores em todas as páginas.</small></span></label>
                <label class="opcao"><input type="checkbox" name="acess" value="contraste">
                    <span><strong>Alto contraste</strong></span></label>
                <label class="opcao"><input type="checkbox" name="acess" value="movimento" checked>
                    <span><strong>Reduzir animações</strong><small>Menos movimento nos menus e botões.</small></span></label>
                <label class="opcao"><input type="checkbox" name="acess" value="fonteSimples" checked>
                    <span><strong>Usar fonte mais simples</strong><small>Troca a fonte de desenho por uma mais fácil de ler.</small></span></label>
                <label class="opcao"><input type="checkbox" name="acess" value="leitor">
                    <span><strong>Descrever as imagens dos produtos</strong></span></label>
            </section>

            <section class="painel" id="painelUsuario">
                <form action="#" method="post">
                    <div class="campo">
                        <label for="uNome">Nome:</label>
                        <input type="text" id="uNome" name="nome" autocomplete="name">
                    </div>
                    <div class="campo">
                        <label for="uEmail">E-mail:</label>
                        <input type="email" id="uEmail" name="email" autocomplete="email">
                    </div>
                    <div class="campo">
                        <label for="uPet">Nome do seu pet:</label>
                        <input type="text" id="uPet" name="pet">
                    </div>
                    <div style="text-align:center; padding-top:10px;">
                        <button type="submit" class="btn-osso">Salvar</button>
                    </div>
                </form>
            </section>

            <section class="painel" id="painelHistorico">
                <!-- Pedidos de exemplo: troque pelos pedidos reais -->
                <article class="item-historico">
                    <span>Pedido #000123</span><span>[Data]</span><strong>R$ 00,00</strong>
                </article>
                <article class="item-historico">
                    <span>Pedido #000122</span><span>[Data]</span><strong>R$ 00,00</strong>
                </article>
            </section>

        </div>
    </main>

</body>
</html>
