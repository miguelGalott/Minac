<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preencher informações - Minac</title>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Alike&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/cores.css">
    <link rel="stylesheet" href="../Css/geral.css">
    <link rel="stylesheet" href="../Css/paginas.css">
</head>
<body>

    <input type="checkbox" id="menuToggle" aria-hidden="true">

    <header id="topoDiv">
        <!-- IMAGEM: gato "Voltar". Volta para o carrinho -->
        <a href="carrinho.html"><img id="logoTopoDiv" src="../imagens/voltar.png" alt="Voltar ao carrinho"></a>

        <h1 class="titulo-pagina">Preencher informações</h1>

        <label for="menuToggle" class="menu-btn">
            <span class="hamburguer"><span></span><span></span><span></span></span>
            <small>mais</small>
        </label>
    </header>

    <aside class="sidebar">
        <label for="menuToggle" class="close-btn" aria-label="Fechar menu">×</label>
        <nav>
            <a href="../index.html">Início</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="usuario.html">Configurações</a>
        </nav>
    </aside>

    <main class="pagina-form">
        <form action="finalizarCompra.html" method="get">
            <div class="form-grade">

                <section class="coluna">
                    <h2 class="sr-only">Dados pessoais e entrega</h2>
                    <!-- IMAGEM: peixinhos decorativos -->
                    <img class="deco-peixe" src="../imagens/peixe.png" alt="" aria-hidden="true">

                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" autocomplete="name" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" required>
                    </div>
                    <div class="campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" pattern="\d{5}-?\d{3}" autocomplete="postal-code" required>
                    </div>
                    <div class="campo">
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Número, apartamento, bloco...">
                    </div>
                </section>

                <section class="coluna coluna-pagamento">
                    <fieldset class="pagamento">
                        <legend class="sr-only">Forma de pagamento</legend>

                        <input type="radio" name="pagamento" id="pgCartao" value="cartao" class="sr-only" checked>
                        <input type="radio" name="pagamento" id="pgPix" value="pix" class="sr-only">

                        <div class="opcoes-pagamento">
                            <!-- IMAGENS: ícone de cartão e ícone do Pix -->
                            <label for="pgCartao"><img src="../imagens/cartao.png" alt=""><span>Cartão</span></label>
                            <label for="pgPix"><img src="../imagens/pix.png" alt=""><span>Pix</span></label>
                        </div>

                        <div class="campos-cartao">
                            <div class="campo">
                                <label for="numCartao">Número do cartão:</label>
                                <input type="text" id="numCartao" name="numCartao" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" pattern="[0-9 ]{13,19}">
                            </div>
                            <div class="campo">
                                <label for="nomeCartao">Nome no cartão:</label>
                                <input type="text" id="nomeCartao" name="nomeCartao" autocomplete="cc-name">
                            </div>
                            <div class="campo">
                                <label for="validade">Validade:</label>
                                <input type="text" id="validade" name="validade" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5" pattern="(0[1-9]|1[0-2])/\d{2}">
                            </div>
                            <div class="campo">
                                <label for="cvv">Código de segurança:</label>
                                <input type="text" id="cvv" name="cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" pattern="\d{3,4}">
                            </div>
                        </div>

                        <div class="campos-pix">
                            <p>O código Pix aparece na próxima tela, depois que você confirmar.</p>
                        </div>
                    </fieldset>
                </section>

            </div>

            <div class="barra-acoes">
                <button type="submit" class="btn-osso">Confirmar</button>
                <button type="reset" class="btn-osso">Limpar</button>
            </div>
        </form>
    </main>

</body>
</html>
