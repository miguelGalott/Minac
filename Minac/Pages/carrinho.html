<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu carrinho - Minac</title>
    <link rel="icon" href="../imagens/logoMinac.png">
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Alike&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/cores.css">
    <link rel="stylesheet" href="../Css/geral.css">
    <link rel="stylesheet" href="../Css/carrinho.css">
    <link rel="stylesheet" href="../Css/tema.css">
    <script src="../Script/theme.js"></script>
</head>
<body class="pagina-carrinho">

    <header class="topo-carrinho">
        <a href="../index.html" class="voltar-topo"><img id="logoTopoDiv" src="../imagens/voltar.png" alt="Voltar à loja"></a>
        <h1>🛒 Meu carrinho</h1>
    </header>

    <ol class="etapas" aria-label="Etapas da compra">
        <li class="atual" aria-current="step"><span>1</span> Carrinho</li>
        <li><span>2</span> Seus dados</li>
        <li><span>3</span> Pronto!</li>
    </ol>

    <main class="carrinho-layout">

        <section class="lista-carrinho" aria-label="Produtos no carrinho">
            <div class="barra-selecao">
                <div class="selecionar-todos">
                    <input type="checkbox" id="selecionarTudo">
                    <label for="selecionarTudo">Selecionar tudo</label>
                </div>
                <button type="button" class="btn-remover-selecionados" disabled>🗑 Remover selecionados</button>
            </div>

            <div class="carrinho-produtos">
                <p class="carrinho-mensagem">Carregando seu carrinho...</p>
            </div>
        </section>

        <aside class="resumo-carrinho" aria-label="Resumo da compra">
            <h2>Resumo</h2>
            <span class="total-texto">Total (0 itens) <strong>R$ 0,00</strong></span>
            <p class="dica-resumo" id="dicaResumo">Marque os produtos que você quer comprar.</p>
            <a href="preencherInfo.html" class="btn-finalizar-compra desativado" aria-disabled="true">Finalizar compra <span aria-hidden="true">&#10140;</span></a>
            <p class="nota-resumo">O frete é escolhido no próximo passo. Retirar na loja é grátis.</p>
        </aside>

    </main>

    <script type="module" src="../Script/paginaCarrinho.js"></script>
</body>
</html>
