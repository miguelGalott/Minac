<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Simulação de Compra</title>
</head>
<body>

  <header>
    <h1>Simulação de Compra</h1>
  </header>

  <main>
    <section>
      <h2>Simular Itens</h2>
      
      <form>
        <div>
          <label for="produto">Valor do Produto (R$):</label>
          <input type="number" id="produto" name="produto" value="0.00" step="0.01">
        </div>

        <div>
          <label for="quantidade">Quantidade:</label>
          <input type="number" id="quantidade" name="quantidade" value="1" min="1">
        </div>

        <div>
          <label for="frete">Frete (R$):</label>
          <input type="number" id="frete" name="frete" value="20.00" readonly>
        </div>

        <div>
          <label for="cupom">Cupom de Desconto:</label>
          <input type="text" id="cupom" name="cupom" placeholder="Digite seu cupom">
        </div>

        <button type="button">Calcular Total</button>
      </form>
    </section>

    <section>
      <h2>Resultado da Simulação</h2>
      <div>
        <p>Subtotal: R$ 0,00</p>
        <p>Frete fixo: R$ 20,00</p>
        <p>Desconto: R$ 0,00</p>
        <h3>Total Estimado: R$ 20,00</h3>
      </div>
    </section>
  </main>

</body>
</html>
