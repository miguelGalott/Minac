<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Finalizar Compra</title>
</head>
<body>

  <header>
    <h1>Finalizar Compra</h1>
  </header>

  <main>
    <section>
      <h2>Resumo do Pedido</h2>
      <ul>
        <li>
          <span>Ração Premium para Gatos (1kg)</span> - R$ 50,00
        </li>
        <li>
          <span>Brinquedo Arranhador</span> - R$ 30,00
        </li>
      </ul>

      <div>
        <p>Subtotal: R$ 80,00</p>
        <p>Frete Único: R$ 20,00</p>
        <h3>Total: R$ 100,00</h3>
      </div>
    </section>

    <form>
      <h2>Dados de Entrega e Pagamento</h2>
      
      <div>
        <label for="endereco">Endereço de Entrega:</label>
        <input type="text" id="endereco" name="endereco" required>
      </div>

      <div>
        <label for="pagamento">Forma de Pagamento:</label>
        <select id="pagamento" name="pagamento">
          <option value="cartao">Cartão de Crédito</option>
          <option value="pix">PIX</option>
          <option value="boleto">Boleto</option>
        </select>
      </div>

      <div>
        <button type="submit">Confirmar e Pagar</button>
      </div>
    </form>
  </main>

</body>
</html>
