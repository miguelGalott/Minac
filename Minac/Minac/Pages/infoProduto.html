<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minac Produto</title>
    <link rel="stylesheet" href="Css/geral.css">
</head>
<body>
    

    <header id="topoDiv">
        <img id="logoTopoDiv" src="imagens/voltarMinac.png" alt="Voltar Minac">

        <div class="topo-pesquisa">
            <input type="text" id="barraPesquisa" name="barraPesquisa" placeholder="Digite um item para seu Pet">
        </div>

        <div class="carrinho-container">
            <img id="carrinhoTopo" src="imagens/carrinho.png" alt="Carrinho">
            <span>Carrinho</span>
        </div>
    </header>

  
    <main class="produto-container">
        

        <section id="fotosImagens">
            <div class="minaturas-galeria">
           
            </div>
            <div class="foto-principal">
                <img src="imagens/fotoPadraoProduto.png" alt="Foto do Produto" id="fotoDeComplemento">
            </div>
        </section>

        <div class="detalhes-produto">
            <button type="button" class="btn-favorito" aria-label="Favoritar">
                <img src="favoritar.png" alt="Favoritar">
            </button>

            <h1 id="titulo">[Nome do Produto Genérico]</h1>

            <div class="precos">
                <span id="price">R$ 00,00</span>
                <span id="desconto">[Desconto ou Promoção]</span>
            </div>


            <div class="frete-info">
                <p>[Informações de entrega e frete]</p>
            </div>

            <p id="descricao">
                [Especificações, tamanhos ou variações do produto]
            </p>

            <button type="button" id="btnConfirmar">
                <img src="botaoCOnfirmar.png" alt="Adicionar ao Carrinho">
            </button>
        </div>

    </main>

</body>
</html>
